<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Translator - Traduce Cualquier Página al Español</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌐 Web Translator</h1>
            <p>Traduce cualquier página web al español manteniendo imágenes y calidad</p>
        </header>

        <main>
            <div class="input-section">
                <div class="input-group">
                    <label for="urlInput">Pega el URL de cualquier página:</label>
                    <input 
                        type="url" 
                        id="urlInput" 
                        placeholder="https://ejemplo.com" 
                        value="https://example.com"
                    >
                    <button id="translateBtn" class="btn-primary">Traducir al Español</button>
                </div>

                <div class="language-options">
                    <label>Traducir a:</label>
                    <select id="languageSelect">
                        <option value="es">Español</option>
                        <option value="en">English</option>
                        <option value="fr">Français</option>
                        <option value="de">Deutsch</option>
                        <option value="it">Italiano</option>
                        <option value="pt">Português</option>
                        <option value="ja">日本語</option>
                        <option value="zh">中文</option>
                    </select>
                </div>

                <div class="loading" id="loading" style="display: none;">
                    <div class="spinner"></div>
                    <p>Cargando y traduciendo página...</p>
                </div>

                <div class="error-message" id="errorMessage" style="display: none;"></div>
            </div>

            <div class="preview-section">
                <div class="controls">
                    <button id="backBtn" class="btn-secondary" style="display: none;">← Volver</button>
                    <button id="downloadBtn" class="btn-secondary" style="display: none;">📥 Descargar HTML</button>
                    <span id="statusText" class="status-text"></span>
                </div>
                
                <div id="previewContainer" class="preview-container">
                    <p class="placeholder">La página traducida aparecerá aquí...</p>
                </div>
            </div>
        </main>

        <footer>
            <p>💡 Tip: Puedes pegar cualquier URL de cualquier idioma. Las imágenes se mantienen intactas.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
