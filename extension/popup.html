<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Translator Extension</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 400px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            color: white;
        }

        .container {
            background: white;
            color: #333;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 1.5em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        p {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 20px;
        }

        .select-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 0.95em;
        }

        select {
            width: 100%;
            padding: 10px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 0.95em;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-translate {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-translate:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-translate:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-reset {
            background: #f8f9fa;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-reset:hover {
            background: #667eea;
            color: white;
        }

        .status {
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9em;
            text-align: center;
            margin-bottom: 15px;
            display: none;
        }

        .status.loading {
            background: #e7f3ff;
            color: #0066cc;
            display: block;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #0066cc;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .info {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.85em;
            color: #666;
            margin-top: 15px;
            line-height: 1.5;
        }

        .info ul {
            margin: 10px 0 0 20px;
        }

        .info li {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌐 Translator</h1>
        <p>Traduce esta página al instante</p>

        <div class="select-group">
            <label for="language">Traducir a:</label>
            <select id="language">
                <option value="es">Español 🇪🇸</option>
                <option value="en">English 🇺🇸</option>
                <option value="fr">Français 🇫🇷</option>
                <option value="de">Deutsch 🇩🇪</option>
                <option value="it">Italiano 🇮🇹</option>
                <option value="pt">Português 🇵🇹</option>
                <option value="ja">日本語 🇯🇵</option>
                <option value="zh">中文 🇨🇳</option>
                <option value="ko">한국어 🇰🇷</option>
                <option value="ru">Русский 🇷🇺</option>
                <option value="ar">العربية 🇸🇦</option>
            </select>
        </div>

        <div class="status" id="status"></div>

        <div class="button-group">
            <button class="btn-translate" id="translateBtn">Traducir Página</button>
            <button class="btn-reset" id="resetBtn">Restaurar</button>
        </div>

        <div class="info">
            <strong>💡 Cómo usar:</strong>
            <ul>
                <li>Elige el idioma</li>
                <li>Haz clic en "Traducir Página"</li>
                <li>La página se traduce al instante</li>
                <li>Usa "Restaurar" para volver al original</li>
            </ul>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
